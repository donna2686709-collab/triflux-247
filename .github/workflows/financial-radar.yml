name: Financial Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Federal Reserve latest news
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import html
          import urllib.request
          import urllib.parse

          page_url = "https://www.federalreserve.gov/newsevents/pressreleases/2026-press.htm"

          req = urllib.request.Request(
              page_url,
              headers={
                  "User-Agent": "Mozilla/5.0 (compatible; TriFlux247/1.0)"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              page = response.read().decode("utf-8", errors="ignore")

          pattern = re.compile(
              r'href="([^"]*/newsevents/pressreleases/[^"]+\.htm)"[^>]*>(.*?)</a>',
              re.IGNORECASE | re.DOTALL
          )

          matches = pattern.findall(page)

          if not matches:
              raise RuntimeError("No Federal Reserve press releases found")

          link, raw_title = matches[0]

          title = re.sub(r"<[^>]+>", "", raw_title)
          title = html.unescape(title)
          title = " ".join(title.split())

          if link.startswith("/"):
              link = "https://www.federalreserve.gov" + link
          elif not link.startswith("http"):
              link = urllib.parse.urljoin(page_url, link)

          state_file = ".last_fed_news"

          previous_link = ""
          if os.path.exists(state_file):
              with open(state_file, "r", encoding="utf-8") as f:
                  previous_link = f.read().strip()

          if previous_link == link:
              print("No new Federal Reserve news.")
          else:
              message = (
                  "🇺🇸 Federal Reserve\n\n"
                  f"📌 {title}\n\n"
                  f"🔗 {link}\n\n"
                  "📡 TriFlux 24/7 Financial Radar"
              )

              telegram_url = (
                  f"https://api.telegram.org/bot"
                  f"{os.environ['BOT_TOKEN']}/sendMessage"
              )

              data = urllib.parse.urlencode({
                  "chat_id": os.environ["CHAT_ID"],
                  "text": message,
                  "disable_web_page_preview": "true"
              }).encode()

              request = urllib.request.Request(
                  telegram_url,
                  data=data,
                  method="POST"
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  print(response.read().decode())

              with open(state_file, "w", encoding="utf-8") as f:
                  f.write(link)

              print("New Federal Reserve news sent.")

          PY

      - name: Save news state
        run: |
          if [ -f .last_fed_news ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .last_fed_news

            if ! git diff --cached --quiet; then
              git commit -m "Update Federal Reserve news state"
              git pull --rebase origin main
              git push
            else
              echo "No state change."
            fi
          fi
