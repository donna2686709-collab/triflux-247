name: Financial Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: financial-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      # =========================
      # Federal Reserve
      # =========================
      - name: Fetch Federal Reserve latest news
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import html
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone

          try:
              year = datetime.now(timezone.utc).year
              page_url = (
                  f"https://www.federalreserve.gov/"
                  f"newsevents/pressreleases/{year}-press.htm"
              )

              req = urllib.request.Request(
                  page_url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (compatible; TriFlux247/1.0)"
                  }
              )

              with urllib.request.urlopen(req, timeout=30) as response:
                  page = response.read().decode("utf-8", errors="ignore")

              pattern = re.compile(
                  r'href="([^"]*/newsevents/pressreleases/[^"]+\.htm)"'
                  r'[^>]*>(.*?)</a>',
                  re.IGNORECASE | re.DOTALL
              )

              matches = pattern.findall(page)

              if not matches:
                  raise RuntimeError("No Federal Reserve press releases found")

              link, raw_title = matches[0]

              title = re.sub(r"<[^>]+>", "", raw_title)
              title = html.unescape(title)
              title = " ".join(title.split())

              if link.startswith("/"):
                  link = "https://www.federalreserve.gov" + link
              elif not link.startswith("http"):
                  link = urllib.parse.urljoin(page_url, link)

              state_file = ".last_fed_news"
              previous_link = ""

              if os.path.exists(state_file):
                  with open(state_file, "r", encoding="utf-8") as f:
                      previous_link = f.read().strip()

              if previous_link == link:
                  print("No new Federal Reserve news.")

              else:
                  message = (
                      "🇺🇸 Federal Reserve\n\n"
                      f"📌 {title}\n\n"
                      f"🔗 {link}\n\n"
                      "📡 TriFlux 24/7 Financial Radar"
                  )

                  telegram_url = (
                      "https://api.telegram.org/bot"
                      + os.environ["BOT_TOKEN"]
                      + "/sendMessage"
                  )

                  telegram_data = urllib.parse.urlencode({
                      "chat_id": os.environ["CHAT_ID"],
                      "text": message,
                      "disable_web_page_preview": "true"
                  }).encode()

                  request = urllib.request.Request(
                      telegram_url,
                      data=telegram_data,
                      method="POST"
                  )

                  with urllib.request.urlopen(request, timeout=30) as response:
                      print(response.read().decode())

                  with open(state_file, "w", encoding="utf-8") as f:
                      f.write(link)

                  print("New Federal Reserve news sent.")

          except Exception as e:
              print(f"Federal Reserve failed, skipping: {e}")
          PY

      # =========================
      # European Central Bank
      # =========================
      - name: Fetch ECB latest news
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import time
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET

          try:
              feed_url = "https://www.ecb.europa.eu/rss/press.html"
              feed_data = None

              for attempt in range(3):
                  try:
                      req = urllib.request.Request(
                          feed_url,
                          headers={
                              "User-Agent": "Mozilla/5.0 (compatible; TriFlux247/1.0)"
                          }
                      )

                      with urllib.request.urlopen(req, timeout=30) as response:
                          feed_data = response.read()

                      break

                  except Exception as e:
                      print(f"ECB attempt {attempt + 1} failed: {e}")

                      if attempt < 2:
                          time.sleep(5)

              if feed_data is None:
                  print("ECB unavailable. Skipping ECB this run.")

              else:
                  root = ET.fromstring(feed_data)
                  items = root.findall(".//item")

                  if not items:
                      raise RuntimeError("No ECB news items found")

                  item = items[0]

                  title = (item.findtext("title") or "").strip()
                  link = (item.findtext("link") or "").strip()

                  if not title or not link:
                      raise RuntimeError("ECB news item missing title or link")

                  state_file = ".last_ecb_news"
                  previous_link = ""

                  if os.path.exists(state_file):
                      with open(state_file, "r", encoding="utf-8") as f:
                          previous_link = f.read().strip()

                  if previous_link == link:
                      print("No new ECB news.")

                  else:
                      message = (
                          "🇪🇺 European Central Bank (ECB)\n\n"
                          f"📌 {title}\n\n"
                          f"🔗 {link}\n\n"
                          "📡 TriFlux 24/7 Financial Radar"
                      )

                      telegram_url = (
                          "https://api.telegram.org/bot"
                          + os.environ["BOT_TOKEN"]
                          + "/sendMessage"
                      )

                      telegram_data = urllib.parse.urlencode({
                          "chat_id": os.environ["CHAT_ID"],
                          "text": message,
                          "disable_web_page_preview": "true"
                      }).encode()

                      request = urllib.request.Request(
                          telegram_url,
                          data=telegram_data,
                          method="POST"
                      )

                      with urllib.request.urlopen(request, timeout=30) as response:
                          print(response.read().decode())

                      with open(state_file, "w", encoding="utf-8") as f:
                          f.write(link)

                      print("New ECB news sent.")

          except Exception as e:
              print(f"ECB failed, skipping: {e}")
          PY

      # =========================
      # Bank of Japan
      # =========================
      - name: Fetch BOJ latest news
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import time
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET

          try:
              feed_url = "https://www.boj.or.jp/en/rss/whatsnew.xml"
              feed_data = None

              for attempt in range(3):
                  try:
                      req = urllib.request.Request(
                          feed_url,
                          headers={
                              "User-Agent": "Mozilla/5.0 (compatible; TriFlux247/1.0)"
                          }
                      )

                      with urllib.request.urlopen(req, timeout=30) as response:
                          feed_data = response.read()

                      break

                  except Exception as e:
                      print(f"BOJ attempt {attempt + 1} failed: {e}")

                      if attempt < 2:
                          time.sleep(5)

              if feed_data is None:
                  print("BOJ unavailable. Skipping BOJ this run.")

              else:
                  root = ET.fromstring(feed_data)

                  items = root.findall(".//item")

                  if not items:
                      items = root.findall(".//{*}entry")

                  if not items:
                      raise RuntimeError("No BOJ news items found")

                  item = items[0]

                  title_node = item.find("{*}title")

                  if title_node is None:
                      title_node = item.find("title")

                  title = (
                      "".join(title_node.itertext()).strip()
                      if title_node is not None
                      else ""
                  )

                  link = (item.findtext("link") or "").strip()

                  if not link:
                      for node in item.findall("{*}link"):
                          link = node.attrib.get("href", "")

                          if link:
                              break

                  if not title or not link:
                      raise RuntimeError("BOJ news item missing title or link")

                  state_file = ".last_boj_news"
                  previous_link = ""

                  if os.path.exists(state_file):
                      with open(state_file, "r", encoding="utf-8") as f:
                          previous_link = f.read().strip()

                  if previous_link == link:
                      print("No new BOJ news.")

                  else:
                      message = (
                          "🇯🇵 Bank of Japan (BOJ)\n\n"
                          f"📌 {title}\n\n"
                          f"🔗 {link}\n\n"
                          "📡 TriFlux 24/7 Financial Radar"
                      )

                      telegram_url = (
                          "https://api.telegram.org/bot"
                          + os.environ["BOT_TOKEN"]
                          + "/sendMessage"
                      )

                      telegram_data = urllib.parse.urlencode({
                          "chat_id": os.environ["CHAT_ID"],
                          "text": message,
                          "disable_web_page_preview": "true"
                      }).encode()

                      request = urllib.request.Request(
                          telegram_url,
                          data=telegram_data,
                          method="POST"
                      )

                      with urllib.request.urlopen(request, timeout=30) as response:
                          print(response.read().decode())

                      with open(state_file, "w", encoding="utf-8") as f:
                          f.write(link)

                      print("New BOJ news sent.")

          except Exception as e:
              print(f"BOJ failed, skipping: {e}")
          PY

      # =========================
      # Bank of England
      # =========================
      - name: Fetch Bank of England latest news
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import html
          import time
          import urllib.request
          import urllib.parse

          try:
              page_url = (
                  "https://www.bankofengland.co.uk/news"
                  "?Direction=Latest&InfiniteScrolling=False"
              )

              page = None

              for attempt in range(3):
                  try:
                      req = urllib.request.Request(
                          page_url,
                          headers={
                              "User-Agent":
                              "Mozilla/5.0 (compatible; TriFlux247/1.0)"
                          }
                      )

                      with urllib.request.urlopen(req, timeout=30) as response:
                          page = response.read().decode(
                              "utf-8",
                              errors="ignore"
                          )

                      break

                  except Exception as e:
                      print(f"BoE attempt {attempt + 1} failed: {e}")

                      if attempt < 2:
                          time.sleep(5)

              if page is None:
                  print("BoE unavailable. Skipping BoE this run.")

              else:
                  matches = re.findall(
                      r'href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',
                      page,
                      flags=re.IGNORECASE | re.DOTALL
                  )

                  selected_link = ""
                  selected_title = ""

                  for link, raw_title in matches:

                      if "/news/" not in link.lower():
                          continue

                      title = re.sub(r"<[^>]+>", " ", raw_title)
                      title = html.unescape(title)
                      title = re.sub(r"\s+", " ", title).strip()

                      if len(title) < 15:
                          continue

                      if link.startswith("/"):
                          link = "https://www.bankofengland.co.uk" + link

                      elif not link.startswith("http"):
                          link = urllib.parse.urljoin(page_url, link)

                      # Remove query strings and fragments so the same
                      # article always has the same deduplication key.
                      parsed = urllib.parse.urlsplit(link)

                      link = urllib.parse.urlunsplit((
                          parsed.scheme,
                          parsed.netloc,
                          parsed.path.rstrip("/"),
                          "",
                          ""
                      ))

                      selected_link = link
                      selected_title = title
                      break

                  if not selected_link or not selected_title:
                      raise RuntimeError(
                          "No Bank of England news item found"
                      )

                  state_file = ".last_boe_news"
                  previous_link = ""

                  if os.path.exists(state_file):
                      with open(state_file, "r", encoding="utf-8") as f:
                          previous_link = f.read().strip()

                  if previous_link == selected_link:
                      print("No new Bank of England news.")

                  else:
                      message = (
                          "🇬🇧 Bank of England (BoE)\n\n"
                          f"📌 {selected_title}\n\n"
                          f"🔗 {selected_link}\n\n"
                          "📡 TriFlux 24/7 Financial Radar"
                      )

                      telegram_url = (
                          "https://api.telegram.org/bot"
                          + os.environ["BOT_TOKEN"]
                          + "/sendMessage"
                      )

                      telegram_data = urllib.parse.urlencode({
                          "chat_id": os.environ["CHAT_ID"],
                          "text": message,
                          "disable_web_page_preview": "true"
                      }).encode()

                      request = urllib.request.Request(
                          telegram_url,
                          data=telegram_data,
                          method="POST"
                      )

                      with urllib.request.urlopen(request, timeout=30) as response:
                          print(response.read().decode())

                      with open(state_file, "w", encoding="utf-8") as f:
                          f.write(selected_link)

                      print("New Bank of England news sent.")

          except Exception as e:
              print(f"BoE failed, skipping: {e}")
          PY

      # =========================
      # Save news state
      # =========================
      - name: Save news state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- .last_fed_news .last_ecb_news .last_boj_news .last_boe_news

          if ! git diff --cached --quiet; then
            git commit -m "Update news state"
            git pull --rebase origin main
            git push
          else
            echo "No state change."
          fi
