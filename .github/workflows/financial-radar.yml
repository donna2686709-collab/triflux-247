name: Financial Radar

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - radar.py
      - "monitors/**"
      - ".github/workflows/financial-radar.yml"
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: financial-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify Python syntax
        run: |
          python3 -m py_compile radar.py
          python3 -m compileall -q monitors
          echo "Financial Radar Python syntax verified."

      - name: Verify Telegram configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          for key in ("TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID"):
              if not os.environ.get(key, "").strip():
                  raise SystemExit(f"Missing required configuration: {key}")
          print("Telegram configuration is present; values are not printed.")
          PY

      - name: Run TriFlux Financial Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python3 radar.py

      - name: Save news state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Update news state"
            git pull --rebase origin main
            git push
          else
            echo "No state change."
          fi
