name: Financial Radar

on:
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Federal Reserve latest news
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET

          feed_url = "https://www.federalreserve.gov/feeds/press_all.xml"

          req = urllib.request.Request(
              feed_url,
              headers={"User-Agent": "TriFlux-247/1.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              xml_data = response.read()

          root = ET.fromstring(xml_data)

          ns = {"atom": "http://www.w3.org/2005/Atom"}
          entry = root.find("atom:entry", ns)

          if entry is None:
              raise RuntimeError("No Federal Reserve news found")

          title = entry.findtext("atom:title", default="", namespaces=ns).strip()

          link_element = entry.find("atom:link", ns)
          link = link_element.get("href", "") if link_element is not None else ""

          updated = entry.findtext("atom:updated", default="", namespaces=ns)

          message = (
              "🇺🇸 Federal Reserve\n\n"
              f"📌 {title}\n\n"
              f"🕒 {updated}\n"
              f"🔗 {link}\n\n"
              "📡 TriFlux 24/7 Financial Radar"
          )

          bot_token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]

          telegram_url = f"https://api.telegram.org/bot{bot_token}/sendMessage"

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message,
              "disable_web_page_preview": "true"
          }).encode()

          request = urllib.request.Request(telegram_url, data=data)

          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.read().decode())
          PY
