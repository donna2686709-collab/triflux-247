name: Financial Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Federal Reserve latest news
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import html
          import urllib.request
          import urllib.parse

          page_url = "https://www.federalreserve.gov/newsevents/pressreleases/2026-press.htm"

          req = urllib.request.Request(
              page_url,
              headers={
                  "User-Agent": "Mozilla/5.0 (compatible; TriFlux247/1.0)"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              page = response.read().decode("utf-8", errors="ignore")

          pattern = re.compile(
              r'href="([^"]*/newsevents/pressreleases/[^"]+\.htm)"[^>]*>(.*?)</a>',
              re.IGNORECASE | re.DOTALL
          )

          matches = pattern.findall(page)

          if not matches:
              raise RuntimeError("No Federal Reserve press releases found")

          link, raw_title = matches[0]

          title = re.sub(r"<[^>]+>", "", raw_title)
          title = html.unescape(title)
          title = " ".join(title.split())

          if link.startswith("/"):
              link = "https://www.federalreserve.gov" + link
          elif not link.startswith("http"):
              link = urllib.parse.urljoin(page_url, link)

          message = (
              "🇺🇸 Federal Reserve\n\n"
              f"📌 {title}\n\n"
              f"🔗 {link}\n\n"
              "📡 TriFlux 24/7 Financial Radar"
          )

          bot_token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]

          telegram_url = (
              f"https://api.telegram.org/bot{bot_token}/sendMessage"
          )

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message,
              "disable_web_page_preview": "true"
          }).encode()

          request = urllib.request.Request(
              telegram_url,
              data=data,
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              result = response.read().decode()
              print(result)

          PY
