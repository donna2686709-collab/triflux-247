name: Financial Radar

on:
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Federal Reserve latest news
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET

feed_url = "https://www.federalreserve.gov/feeds/press_all.xml?format=xml"

          req = urllib.request.Request(
              feed_url,
              headers={"User-Agent": "Mozilla/5.0 TriFlux247/1.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              xml_data = response.read()

          root = ET.fromstring(xml_data)

          # Federal Reserve feed uses Atom-style entries.
          entries = root.findall(".//{*}entry")

          # Also support normal RSS <item> feeds.
          if not entries:
              entries = root.findall(".//item")

          if not entries:
              raise RuntimeError("No Federal Reserve news entries found")

          entry = entries[0]

          def find_text(element, name):
              node = element.find(f"{{*}}{name}")
              if node is None:
                  node = element.find(name)
              if node is not None and node.text:
                  return node.text.strip()
              return ""

          title = find_text(entry, "title")
          updated = (
              find_text(entry, "updated")
              or find_text(entry, "published")
              or find_text(entry, "pubDate")
          )

          link = ""

          for link_node in entry.findall("{*}link"):
              href = link_node.attrib.get("href")
              if href:
                  link = href
                  break

          if not link:
              link_node = entry.find("link")
              if link_node is not None:
                  link = (link_node.text or "").strip()

          if not title:
              title = "Federal Reserve Update"

          message = (
              "🇺🇸 Federal Reserve\n\n"
              f"📌 {title}\n\n"
              f"🕒 {updated}\n"
              f"🔗 {link}\n\n"
              "📡 TriFlux 24/7 Financial Radar"
          )

          bot_token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]

          telegram_url = (
              f"https://api.telegram.org/bot{bot_token}/sendMessage"
          )

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message,
              "disable_web_page_preview": "true"
          }).encode()

          request = urllib.request.Request(
              telegram_url,
              data=data,
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              result = response.read().decode()
              print(result)

          PY
