name: Financial Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Federal Reserve latest news
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import html
          import urllib.request
          import urllib.parse

          page_url = "https://www.federalreserve.gov/newsevents/pressreleases/2026-press.htm"

          req = urllib.request.Request(
              page_url,
              headers={
                  "User-Agent": "Mozilla/5.0 (compatible; TriFlux247/1.0)"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              page = response.read().decode("utf-8", errors="ignore")

          pattern = re.compile(
              r'href="([^"]*/newsevents/pressreleases/[^"]+\.htm)"[^>]*>(.*?)</a>',
              re.IGNORECASE | re.DOTALL
          )

          matches = pattern.findall(page)

          if not matches:
              raise RuntimeError("No Federal Reserve press releases found")

          link, raw_title = matches[0]

          title = re.sub(r"<[^>]+>", "", raw_title)
          title = html.unescape(title)
          title = " ".join(title.split())

          if link.startswith("/"):
              link = "https://www.federalreserve.gov" + link
          elif not link.startswith("http"):
              link = urllib.parse.urljoin(page_url, link)

          state_file = ".last_fed_news"

          previous_link = ""
          if os.path.exists(state_file):
              with open(state_file, "r", encoding="utf-8") as f:
                  previous_link = f.read().strip()

          if previous_link == link:
              print("No new Federal Reserve news.")
          else:
              message = (
                  "🇺🇸 Federal Reserve\n\n"
                  f"📌 {title}\n\n"
                  f"🔗 {link}\n\n"
                  "📡 TriFlux 24/7 Financial Radar"
              )

              telegram_url = (
                  f"https://api.telegram.org/bot"
                  f"{os.environ['BOT_TOKEN']}/sendMessage"
              )

              data = urllib.parse.urlencode({
                  "chat_id": os.environ["CHAT_ID"],
                  "text": message,
                  "disable_web_page_preview": "true"
              }).encode()

              request = urllib.request.Request(
                  telegram_url,
                  data=data,
                  method="POST"
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  print(response.read().decode())

              with open(state_file, "w", encoding="utf-8") as f:
                  f.write(link)

              print("New Federal Reserve news sent.")

          PY
      - name: Fetch ECB latest news
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET

          feed_url = "https://www.ecb.europa.eu/rss/press.html"
          req = urllib.request.Request(
              feed_url,
              headers={"User-Agent": "Mozilla/5.0 TriFlux247/1.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              root = ET.fromstring(response.read())

          items = root.findall(".//item")
          if not items:
              raise RuntimeError("No ECB news items found")

          item = items[0]
          title = (item.findtext("title") or "").strip()
          link = (item.findtext("link") or "").strip()

          if not title or not link:
              raise RuntimeError("ECB news item missing title or link")

          state_file = ".last_ecb_news"
          previous_link = ""

          if os.path.exists(state_file):
              with open(state_file, "r", encoding="utf-8") as f:
                  previous_link = f.read().strip()

          if previous_link == link:
              print("No new ECB news.")
          else:
              message = (
                  "🇪🇺 European Central Bank (ECB)\n\n"
                  f"📌 {title}\n\n"
                  f"🔗 {link}\n\n"
                  "📡 TriFlux 24/7 Financial Radar"
              )

              telegram_url = (
                  "https://api.telegram.org/bot"
                  + os.environ["BOT_TOKEN"]
                  + "/sendMessage"
              )

              data = urllib.parse.urlencode({
                  "chat_id": os.environ["CHAT_ID"],
                  "text": message,
                  "disable_web_page_preview": "true"
              }).encode()

              request = urllib.request.Request(
                  telegram_url, data=data, method="POST"
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  print(response.read().decode())

              with open(state_file, "w", encoding="utf-8") as f:
                  f.write(link)

              print("New ECB news sent.")
          PY
      - name: Fetch BOJ latest news
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET

          feed_url = "https://www.boj.or.jp/en/rss/whatsnew.xml"
          req = urllib.request.Request(
              feed_url,
              headers={"User-Agent": "Mozilla/5.0 TriFlux247/1.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              root = ET.fromstring(response.read())

          items = root.findall(".//item")
          if not items:
              items = root.findall(".//{*}entry")

          if not items:
              raise RuntimeError("No BOJ news items found")

          item = items[0]
          title_node = item.find("{*}title")
          if title_node is None:
              title_node = item.find("title")

          title = (
              "".join(title_node.itertext()).strip()
              if title_node is not None else ""
          )

          link = (item.findtext("link") or "").strip()

          if not link:
              for node in item.findall("{*}link"):
                  link = node.attrib.get("href", "")
                  if link:
                      break

          if not title or not link:
              raise RuntimeError("BOJ news item missing title or link")

          state_file = ".last_boj_news"
          previous_link = ""

          if os.path.exists(state_file):
              with open(state_file, "r", encoding="utf-8") as f:
                  previous_link = f.read().strip()

          if previous_link == link:
              print("No new BOJ news.")
          else:
              message = (
                  "🇯🇵 Bank of Japan (BOJ)\n\n"
                  f"📌 {title}\n\n"
                  f"🔗 {link}\n\n"
                  "📡 TriFlux 24/7 Financial Radar"
              )

              telegram_url = (
                  "https://api.telegram.org/bot"
                  + os.environ["BOT_TOKEN"]
                  + "/sendMessage"
              )

              data = urllib.parse.urlencode({
                  "chat_id": os.environ["CHAT_ID"],
                  "text": message,
                  "disable_web_page_preview": "true"
              }).encode()

              request = urllib.request.Request(
                  telegram_url, data=data, method="POST"
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  print(response.read().decode())

              with open(state_file, "w", encoding="utf-8") as f:
                  f.write(link)

              print("New BOJ news sent.")
          PY
            - name: Fetch IMF latest news
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import html
          import urllib.request
          import urllib.parse

          page_url = "https://www.imf.org/en/news"

          req = urllib.request.Request(
              page_url,
              headers={"User-Agent": "Mozilla/5.0 TriFlux247/1.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              page = response.read().decode("utf-8", errors="ignore")

          matches = re.findall(
              r'href=["\']([^"\']*/en/news/articles/[^"\']+)["\'][^>]*>(.*?)</a>',
              page,
              flags=re.IGNORECASE | re.DOTALL
          )

          if not matches:
              raise RuntimeError("No IMF news items found")

          link, raw_title = matches[0]

          if link.startswith("/"):
              link = "https://www.imf.org" + link

          title = re.sub(r"<[^>]+>", " ", raw_title)
          title = html.unescape(title)
          title = re.sub(r"\s+", " ", title).strip()

          if not title or not link:
              raise RuntimeError("IMF news item missing title or link")

          state_file = ".last_imf_news"
          previous_link = ""

          if os.path.exists(state_file):
              with open(state_file, "r", encoding="utf-8") as f:
                  previous_link = f.read().strip()

          if previous_link == link:
              print("No new IMF news.")
          else:
              message = (
                  "🌍 International Monetary Fund (IMF)\n\n"
                  f"📌 {title}\n\n"
                  f"🔗 {link}\n\n"
                  "📡 TriFlux 24/7 Financial Radar"
              )

              telegram_url = (
                  "https://api.telegram.org/bot"
                  + os.environ["BOT_TOKEN"]
                  + "/sendMessage"
              )

              data = urllib.parse.urlencode({
                  "chat_id": os.environ["CHAT_ID"],
                  "text": message,
                  "disable_web_page_preview": "true"
              }).encode()

              request = urllib.request.Request(
                  telegram_url,
                  data=data,
                  method="POST"
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  print(response.read().decode())

              with open(state_file, "w", encoding="utf-8") as f:
                  f.write(link)

              print("New IMF news sent.")
          PY
            - name: Save news state
        run: |
          if [ -f .last_fed_news ] || [ -f .last_ecb_news ] || [ -f .last_boj_news ] || [ -f .last_imf_news ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .last_fed_news .last_ecb_news .last_boj_news .last_imf_news

            if ! git diff --cached --quiet; then
              git commit -m "Update news state"
              git pull --rebase origin main
              git push
            else
              echo "No state change."
            fi
          fi
