name: Live Crypto Liquidation Test

on:
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Send one TEST message to Telegram"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test-liquidations:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install websockets
        run: pip install websockets

      - name: Send Telegram TEST message
        if: ${{ inputs.telegram_test == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: python3 -c "from core.telegram import send_telegram; send_telegram('🧪 TRIFLUX TELEGRAM TEST\n\nTEST MESSAGE - NOT A REAL MARKET ALERT\n\nGlobal Crypto Liquidation Radar\nTelegram delivery path verified.\n\nTriFlux 24/7'); print('TELEGRAM TEST PASS')"

      - name: Test live liquidation stream
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: timeout 180 python3 -u live/liquidations.py || test $? -eq 124
